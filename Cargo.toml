[workspace]
resolver = "3"
members = ["crates/ptk-core", "crates/ptk-cli", "crates/ptk-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Hallel133/Porting-Toolkit"
rust-version = "1.85"

[workspace.dependencies]
ptk-core = { path = "crates/ptk-core" }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "1"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
strip = true
