[package]
name = "ptk-gui"
description = "Porting Toolkit desktop GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "ptk-gui"
path = "src/main.rs"

[dependencies]
ptk-core.workspace = true
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The native macOS menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
arboard = { version = "3", default-features = false }
