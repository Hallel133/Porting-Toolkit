[project]
name = "ptk-engine"
version = "0.1.0"
description = "Porting Toolkit engine: game detection, import/export pipelines and plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Hallel133 and Porting Toolkit contributors" }]
# The engine itself uses only the standard library, so `ptk` can also run it
# with a plain python3. Plugins bring their own dependencies.
dependencies = []

[project.scripts]
ptk-engine = "ptk_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptk_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
