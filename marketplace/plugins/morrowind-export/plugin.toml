schema_version = 1

[plugin]
id = "morrowind-export"
name = "Morrowind export (OpenMW)"
version = "1.0.0"
kind = "export"
description = "Runs The Elder Scrolls III: Morrowind (Data Files with Morrowind.esm, Tribunal and Bloodmoon) on macOS and Linux with OpenMW."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "morrowind_export:Plugin"
api = 2
homepage = "https://github.com/OpenMW/openmw"

[formats]
inputs = ["openmw"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
