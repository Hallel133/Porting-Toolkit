schema_version = 1

[plugin]
id = "ohrrpgce-export"
name = "OHRRPGCE export"
version = "1.0.0"
kind = "export"
description = "Runs OHRRPGCE games (.rpg files) with the OHRRPGCE player you provide."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "ohrrpgce_export:Plugin"
api = 2
homepage = "https://rpg.hamsterrepublic.com/ohrrpgce/Source"

[formats]
inputs = ["ohrrpgce"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = false
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
