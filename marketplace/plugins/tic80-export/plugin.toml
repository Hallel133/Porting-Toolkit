schema_version = 1

[plugin]
id = "tic80-export"
name = "TIC-80 export"
version = "1.0.0"
kind = "export"
description = "Runs TIC-80 fantasy-console carts (.tic) on macOS, Windows and Linux with TIC-80."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "tic80_export:Plugin"
api = 2
homepage = "https://github.com/nesbox/TIC-80"

[formats]
inputs = ["tic80"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
