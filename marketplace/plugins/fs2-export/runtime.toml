# FreeSpace Open: https://github.com/scp-fs2open/fs2open.github.com (Volition source code licence (non-commercial)).
# FreeSpace Open reads the game's .vp files from the folder it starts in (the launcher starts it in the game folder). The SSE2 Windows build is used because it runs on every 64-bit PC. FreeSpace Open's licence forbids selling it.
[runtime]
id = "fs2open"
name = "FreeSpace Open"
version = "26.2.0"
source = "https://github.com/scp-fs2open/fs2open.github.com"
license = "Volition source code licence (non-commercial)"

[runtime.executable]
macos = "*.app"
windows = "fs2_open*.exe"
linux = "fs2_open*"

[download.macos-arm64]
url = "https://github.com/scp-fs2open/fs2open.github.com/releases/download/release_26_2_0/fs2_open_26_2_0-builds-Mac-arm64.tar.gz"
sha256 = "c40195b74c7d6e5c51df4d06f933a1924358373564708a850e801a81d909e607"

[download.macos-x64]
url = "https://github.com/scp-fs2open/fs2open.github.com/releases/download/release_26_2_0/fs2_open_26_2_0-builds-Mac-x86_64.tar.gz"
sha256 = "076b70e70c5e40dd967faa3be9a70e0f9726bf16ca682fb224ce275d3cb43f7d"

[download.windows-x64]
url = "https://github.com/scp-fs2open/fs2open.github.com/releases/download/release_26_2_0/fs2_open_26_2_0-builds-x64-SSE2.zip"
sha256 = "8ac33c8a8312e4966b55326e7073876d6aa771a1eef576adde8f22d6176ba63f"

[download.linux-x64]
url = "https://github.com/scp-fs2open/fs2open.github.com/releases/download/release_26_2_0/fs2_open_26_2_0-builds-Linux-x86_64.tar.gz"
sha256 = "a5c862bd8aa15b433daf17b242720d0574b3f21ee57edcb277dc83546c048ee4"

[launch]
args = []

[game]
required = ["root_fs2.vp", "*.vp"]
