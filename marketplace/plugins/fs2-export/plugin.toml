schema_version = 1

[plugin]
id = "fs2-export"
name = "FreeSpace 2 export (FreeSpace Open)"
version = "1.0.0"
kind = "export"
description = "Runs FreeSpace 2 (its .vp archives) on macOS, Windows and Linux with FreeSpace Open."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "fs2_export:Plugin"
api = 2
homepage = "https://github.com/scp-fs2open/fs2open.github.com"

[formats]
inputs = ["fs2"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
