schema_version = 1

[plugin]
id = "dos-export"
name = "Gold Box export (DOSBox Staging)"
version = "1.0.0"
kind = "export"
description = "Runs SSI Gold Box games (Pool of Radiance and others: .DAX data) on macOS, Windows and Linux with DOSBox Staging."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "dos_export:Plugin"
api = 2
homepage = "https://github.com/dosbox-staging/dosbox-staging"

[formats]
inputs = ["goldbox"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
