schema_version = 1

[plugin]
id = "fna-export"
name = "XNA export (FNA)"
version = "1.0.0"
kind = "export"
description = "Runs Microsoft XNA 4 games on macOS and Linux with FNA, from an FNA kit you build once (FNA with its XNA assemblies, fnalibs and MonoKickstart)."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "fna_export:Plugin"
api = 2
homepage = "https://fna-xna.github.io"

[formats]
inputs = ["xna"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = false
subprocess = true   # codesign for the macOS app
