# Daggerfall Unity: https://github.com/Interkarma/daggerfall-unity (MIT).
# Daggerfall Unity asks for the Daggerfall folder on its first start: choose the game folder inside the build (it holds ARENA2).
[runtime]
id = "daggerfall-unity"
name = "Daggerfall Unity"
version = "1.1.1"
source = "https://github.com/Interkarma/daggerfall-unity"
license = "MIT"

[runtime.executable]
macos = "*.app"
windows = "DaggerfallUnity.exe"
linux = "DaggerfallUnity.x86_64"

[runtime.installed]
macos = ["/Applications/DaggerfallUnity.app", "~/Applications/DaggerfallUnity.app"]

[download.macos]
url = "https://github.com/Interkarma/daggerfall-unity/releases/download/v1.1.1-cve-2025/dfu_mac_universal-v1.1.1.zip"
sha256 = "1edc4dd594b61686e187b84d99e295074670f07e3d308c29caa3378b6368bf56"

[download.windows-x64]
url = "https://github.com/Interkarma/daggerfall-unity/releases/download/v1.1.1-cve-2025/dfu_windows_64bit-v1.1.1.zip"
sha256 = "b4eb2620cdf31f973ed1105d06be8a31f21796915d65c253a93eeb02cb1d64bd"

[download.linux-x64]
url = "https://github.com/Interkarma/daggerfall-unity/releases/download/v1.1.1-cve-2025/dfu_linux_64bit-v1.1.1.zip"
sha256 = "be3c476ae92972f42448757719266ad82c04868eb7b6f3a3c90fcfcf1490849a"

[launch]
args = []

[game]
required = ["arena2/*"]
