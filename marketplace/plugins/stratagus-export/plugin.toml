schema_version = 1

[plugin]
id = "stratagus-export"
name = "Stratagus export"
version = "1.0.0"
kind = "export"
description = "Runs Stratagus games (Wargus, Stargus and others: a folder with scripts/stratagus.lua) with a Stratagus build you provide."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "stratagus_export:Plugin"
api = 2
homepage = "https://github.com/Wargus/stratagus"

[formats]
inputs = ["stratagus"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = false
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
