schema_version = 1

[plugin]
id = "alephone-export"
name = "Marathon export (Aleph One)"
version = "1.0.0"
kind = "export"
description = "Runs Marathon, Marathon 2, Marathon Infinity and other Aleph One scenarios (Shapes, Sounds, Map files) on macOS and Windows with Aleph One."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "alephone_export:Plugin"
api = 2
homepage = "https://github.com/Aleph-One-Marathon/alephone"

[formats]
inputs = ["alephone"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
