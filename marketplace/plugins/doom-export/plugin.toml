schema_version = 1

[plugin]
id = "doom-export"
name = "Doom engine export (UZDoom)"
version = "1.0.0"
kind = "export"
description = "Runs Doom, Doom II, Heretic, Hexen, Strife and Freedoom (their IWADs) on macOS, Windows and Linux with UZDoom, the maintained continuation of GZDoom."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "doom_export:Plugin"
api = 2
homepage = "https://github.com/UZDoom/UZDoom"

[formats]
inputs = ["doom"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
