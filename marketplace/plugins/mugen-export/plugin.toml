schema_version = 1

[plugin]
id = "mugen-export"
name = "M.U.G.E.N export (Ikemen GO)"
version = "1.0.0"
kind = "export"
description = "Runs M.U.G.E.N content (chars/, stages/, data/) on macOS, Windows and Linux with Ikemen GO."
license = "MIT"
authors = ["Porting Toolkit contributors"]
entry = "mugen_export:Plugin"
api = 2
homepage = "https://github.com/ikemen-engine/Ikemen-GO"

[formats]
inputs = ["mugen"]
outputs = ["app", "folder", "zip"]
targets = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

[permissions]
read = ["$GAME", "$PROJECT"]
write = ["$OUTPUT"]
network = ["github.com", "objects.githubusercontent.com", "release-assets.githubusercontent.com"]
subprocess = true   # codesign for the macOS app, hdiutil to open disk images
